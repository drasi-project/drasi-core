[package]
name = "stockroom"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "signal", "io-std", "io-util"] }
drasi-core = { path = "../drasi-core/core", features = ["computation"] }
drasi-lib = { path = "../drasi-core/lib" }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
