[package]
name = "otel-getting-started"
version = "0.1.0"
edition = "2021"
publish = false
description = "DrasiLib OpenTelemetry source getting-started example"

[workspace]

[dependencies]
anyhow = "1.0"
drasi-lib = { path = "../../../lib" }
drasi-source-otel = { path = "../../../components/sources/otel" }
drasi-reaction-log = { path = "../../../components/reactions/log" }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
prost = "0.12"

[[bin]]
name = "otel-getting-started"
path = "main.rs"

[[bin]]
name = "send-otlp"
path = "send.rs"
