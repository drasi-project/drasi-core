[package]
name = "github-getting-started"
version = "0.1.0"
edition = "2021"
publish = false
description = "DrasiLib getting-started example for the authorized GitHub source"

[workspace]

[dependencies]
anyhow = "1.0"
axum = "0.7"
drasi-lib = { path = "../../../lib" }
drasi-reaction-log = { path = "../../../components/reactions/log" }
drasi-source-github = { path = "../../../components/sources/github" }
drasi-state-store-redb = { path = "../../../components/state_stores/redb" }
drasi-wal-redb = { path = "../../../components/wals/redb" }
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[[bin]]
name = "github-getting-started"
path = "main.rs"
