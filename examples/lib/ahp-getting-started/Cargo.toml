[package]
name = "ahp-getting-started"
version = "0.1.0"
edition = "2021"
publish = false
description = "DrasiLib example: continuous queries over Agent Host Protocol (AHP) agent sessions"

[workspace]

[dependencies]
anyhow = "1.0"
drasi-ahp-common = { path = "../../../components/ahp-common", features = ["mock-host"] }
drasi-bootstrap-ahp = { path = "../../../components/bootstrappers/ahp" }
drasi-lib = { path = "../../../lib" }
drasi-reaction-log = { path = "../../../components/reactions/log" }
drasi-source-ahp = { path = "../../../components/sources/ahp" }
env_logger = "0.11"
serde_json = "1.0"
tokio = { version = "1.6", features = ["full"] }

[[bin]]
name = "ahp-getting-started"
path = "main.rs"
