        action: signal
        workflowId: "order-{{after.orderId}}"
        signalName: paid
    shipped:
      added:
        action: signal
        workflowId: "order-{{after.orderId}}"
        signalName: shipped
    delivered:
      added:
        action: signal
        workflowId: "order-{{after.orderId}}"
        signalName: delivered
