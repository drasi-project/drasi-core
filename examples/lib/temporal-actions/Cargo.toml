[package]
name = "temporal-actions-example"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bincode = "1.3"
drasi-lib = { path = "../../../lib" }
drasi-plugin-sdk = { path = "../../../components/plugin-sdk" }
drasi-reaction-temporal = { path = "../../../components/reactions/temporal" }
drasi-source-postgres = { path = "../../../components/sources/postgres" }
drasi-index-rocksdb = { path = "../../../components/indexes/rocksdb" }
drasi-state-store-redb = { path = "../../../components/state_stores/redb" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-util", "net", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "temporal-actions-example"
path = "main.rs"
