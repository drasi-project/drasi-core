[package]
name = "ahp-incident-agents-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "DrasiLib example that dispatches an AHP agent session per critical incident"

# Keep this crate independent from the parent workspace
[workspace]

[dependencies]
drasi-lib = { path = "../../../lib" }
drasi-source-application = { path = "../../../components/sources/application" }
drasi-reaction-ahp = { path = "../../../components/reactions/ahp", features = ["mock-host"] }

tokio = { version = "1.6", features = ["full"] }
anyhow = "1.0"
env_logger = "0.10.0"

[[bin]]
name = "ahp-incident-agents-example"
path = "main.rs"
