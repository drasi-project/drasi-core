name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/*
      - feature-lib
      - release/*

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read


jobs:
  signature-repair:
    name: Plugin Signature Repair Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Test recovery helper and workflow gates
        run: python3 .github/scripts/repair-plugin-signatures.test.py

  test:
    uses: drasi-project/.github/.github/workflows/rust-unit-test.yaml@main
    with:
      runner: ubuntu-24.04
      test-command: |
        .github/scripts/package-visibility.test.sh
        .github/scripts/release-with-retry.test.sh
        python3 .github/scripts/build-test-plugins.test.py
        cargo run --locked -p xtask -- check-publish-dependency-cycles
        make test
        python3 lib/docs/developer-guide/check_book.py --test --network

  features:
    name: Additional feature configurations
    strategy:
      fail-fast: false
      matrix:
        command:
          - >-
            cargo test --locked -p drasi-lib -p lib-integration-tests --no-default-features
            --features drasi-lib/computation-rocksdb-tests,drasi-lib/middleware-decoder,drasi-lib/middleware-map,drasi-lib/middleware-parse-json,drasi-lib/middleware-promote,drasi-lib/middleware-relabel,drasi-lib/middleware-unwind,lib-integration-tests/computation-middleware-tests,lib-integration-tests/garnet-tests
            --lib --tests
          - cargo test --locked -p drasi-core --features parallel_solver
    uses: drasi-project/.github/.github/workflows/rust-unit-test.yaml@main
    with:
      runner: ubuntu-24.04
      test-command: |
        ${{ matrix.command }} -- --test-threads=1
