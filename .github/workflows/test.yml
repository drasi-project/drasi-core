name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/*
      - feature-lib
      - release/*

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read


jobs:
  rocksdb:
    name: RocksDB (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04-arm, macos-latest]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Record toolchain versions
        run: |
          rustup show
          c++ --version
          clang --version
          cmake --version
      - name: Cache RocksDB build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rocksdb-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Test RocksDB indexes
        run: cargo test -p drasi-index-rocksdb --features plugin-descriptor
      - name: Lint RocksDB indexes
        run: cargo clippy -p drasi-index-rocksdb --all-targets --features plugin-descriptor -- -D warnings

  signature-repair:
    name: Plugin Signature Repair Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Test recovery helper and workflow gates
        run: python3 .github/scripts/repair-plugin-signatures.test.py

  test:
    uses: drasi-project/.github/.github/workflows/rust-unit-test.yaml@main
    with:
      test-command: |
        .github/scripts/package-visibility.test.sh
        .github/scripts/release-with-retry.test.sh
        cargo run -p xtask -- check-publish-dependency-cycles
        cargo test --workspace --exclude drasi-host-sdk
        make test-host-sdk
