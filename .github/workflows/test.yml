name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/*
      - feature-lib
      - release/*

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read


jobs:
  test:
    uses: drasi-project/.github/.github/workflows/rust-unit-test.yaml@main
    with:
      test-command: |
        .github/scripts/package-visibility.test.sh
        .github/scripts/release-with-retry.test.sh
        cargo run -p xtask -- check-publish-dependency-cycles
        python3 lib/tests/runtime_parity/test_requirements.py
        bash lib/tests/runtime_parity/check-runner.sh
        make build-native-network-plugin
        make build-test-plugins
        cargo test --workspace --exclude drasi-host-sdk --exclude drasi-lib --exclude lib-integration-tests -- --test-threads=1
        bash lib/tests/run-runtime-parity.sh
        cargo test -p drasi-lib --doc
        cargo test -p drasi-core --features parallel_solver
