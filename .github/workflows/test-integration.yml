# Runs #[ignore]d plugin integration/e2e tests that start containers.
# The package list is discovered from the workspace (xtask
# list-integration-test-matrix), so new crates are picked up automatically.
# Default `cargo test` (test.yml) skips these. Live-network / credential
# ignored tests are not included.

name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/*
      - feature-lib
      - release/*

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  discover:
    name: Discover integration tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show Rust toolchain
        run: rustup show

      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Cargo build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: target
          key: ${{ runner.os }}-cargo-xtask-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-xtask-
            ${{ runner.os }}-cargo-build-

      - name: Build integration test matrix
        id: matrix
        run: |
          matrix="$(cargo run -p xtask --quiet -- list-integration-test-matrix)"
          {
            echo "matrix<<EOF"
            echo "${matrix}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "${matrix}" | grep -q '"include":\[\]'; then
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Discovered matrix:"
          echo "${matrix}"

  integration:
    name: ${{ matrix.name }}
    needs: discover
    if: >-
      ${{ !cancelled()
        && needs.discover.result == 'success'
        && needs.discover.outputs.has_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libjq-dev libonig-dev protobuf-compiler

      - name: Set JQ_LIB_DIR
        run: echo "JQ_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Install Oracle Instant Client
        if: contains(matrix.extra, 'oracle')
        run: |
          sudo apt-get install -y unzip
          sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
          # Ubuntu 24.04 ships libaio.so.1t64; Instant Client still dlopens libaio.so.1.
          if [ ! -e /usr/lib/x86_64-linux-gnu/libaio.so.1 ] && [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1t64 ]; then
            sudo ln -s libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          fi
          curl -fsSL -o /tmp/instantclient.zip \
            https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          sudo mkdir -p /opt/oracle
          sudo unzip -q /tmp/instantclient.zip -d /opt/oracle
          ic_dir="$(find /opt/oracle -maxdepth 1 -type d -name 'instantclient*' | head -1)"
          echo "LD_LIBRARY_PATH=${ic_dir}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$ic_dir" >> "$GITHUB_PATH"

      - name: Show Rust toolchain
        run: rustup show

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "/opt/hostedtoolcache/CodeQL"
          sudo docker image prune --all --force || true
          df -h

      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Cargo build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: target
          key: ${{ runner.os }}-cargo-integration-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-${{ matrix.package }}-
            ${{ runner.os }}-cargo-build-

      - name: Build FFI test plugins
        if: contains(matrix.extra, 'plugins')
        run: |
          set -euo pipefail
          mkdir -p target/debug/plugins
          pkg="${{ matrix.package }}"
          packages="$pkg"
          case "$pkg" in
            drasi-source-*)
              packages="$packages drasi-bootstrap-${pkg#drasi-source-}"
              ;;
          esac
          for build_pkg in $packages; do
            cargo build --lib -p "$build_pkg" --features "$build_pkg/dynamic-plugin"
          done
          for src in target/debug/libdrasi_*.so target/debug/drasi_*.so; do
            [ -f "$src" ] || continue
            cp "$src" target/debug/plugins/
          done
          ls -la target/debug/plugins

      - name: Run ignored integration tests
        run: |
          cargo test -p ${{ matrix.package }} --test ${{ matrix.test }} -- --ignored --nocapture --test-threads=1
