name: Nightly Build

# Rehearse packaging and signed publication from one locked, prepared candidate.
# No crates.io writes, official tags/releases, or production OCI repositories.

on:
  schedule:
    # 12:00 UTC daily = 05:00 PDT / 04:00 PST. GitHub cron does not observe DST.
    # Runs against main.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      allow_branch_test:
        description: 'TEMPORARY: signed isolated rehearsal on ruokun-niu-core-release-safeguards only'
        required: false
        type: boolean
        default: false

permissions:
  # Least privilege by default; elevated scopes are granted per-job below.
  contents: read

jobs:
  prepare:
    name: Prepare locked release candidate
    if: ${{ github.repository == 'drasi-project/drasi-core' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.allow_branch_test == true && github.ref == 'refs/heads/ruokun-niu-core-release-safeguards')) }}
    runs-on: ubuntu-latest
    outputs:
      candidate_sha256: ${{ steps.freeze.outputs.candidate_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install release tools
        uses: ./.github/actions/install-release-tools

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Prepare release versions without publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-plz update

      - name: Freeze prepared source and lockfile
        id: freeze
        env:
          ALLOW_BRANCH_TEST: ${{ inputs.allow_branch_test == true }}
        run: python3 .github/scripts/release-candidate.py freeze --output "$RUNNER_TEMP/candidate"

      - name: Retain exact prepared candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package and verify local release crates
    needs: prepare
    runs-on: ubuntu-latest-8-cores
    env:
      CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Restore exact source
        run: python3 .github/scripts/release-candidate.py restore --bundle candidate --sha256 "$CANDIDATE_SHA256" --root prepared
      - name: Install packaging build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjq-dev libssl-dev protobuf-compiler cmake clang libclang-dev
          echo "JQ_LIB_DIR=/usr/lib/$(uname -m)-linux-gnu" >> "$GITHUB_ENV"
      - name: Package with extracted-source build verification
        run: python3 .github/scripts/release-candidate.py package --bundle candidate --sha256 "$CANDIDATE_SHA256" --root prepared --output packages.json
      - name: Retain verified crate archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-crates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prepared/target/package/*.crate
            packages.json
          if-no-files-found: error

  publish-plugins:
    name: Publish nightly plugins
    needs: [prepare, package]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-plugins.yml
    with:
      allow_branch_test: ${{ inputs.allow_branch_test == true }}
      candidate_artifact: nightly-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      candidate_sha256: ${{ needs.prepare.outputs.candidate_sha256 }}
      registry: ghcr.io/drasi-project/drasi-core-nightly
      tag: nightly-${{ github.run_id }}-${{ github.run_attempt }}
      sign: true
      dry_run: false
      skip_visibility: false
    secrets:
      PACKAGES_ADMIN_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}

  handoff:
    name: Emit complete producer handoff
    needs: [prepare, package, publish-plugins]
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-crates-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: plugin-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: reports
          merge-multiple: true
      - name: Require complete verified inventory
        run: |
          python3 .github/scripts/release-candidate.py handoff --bundle candidate \
            --sha256 "$CANDIDATE_SHA256" --reports reports --packages crates/packages.json \
            --output ready.json
      - name: Retain consumer handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ready.json
          if-no-files-found: error
          retention-days: 90
      - name: Summarize producer readiness
        run: |
          {
            echo "Prepared candidate: $CANDIDATE_SHA256"
            echo "All eight publication targets passed. This is producer readiness, not runtime E2E success."
            echo "Consumer must select run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT and verify completed success."
          } >> "$GITHUB_STEP_SUMMARY"

  # If any job in the nightly failed, open (or update) a tracking issue so the
  # failure is visible without watching Actions.
  # Dedupes: if an open issue with the `nightly-failure` label already exists, it
  # adds a comment instead of opening a new one.
  report-failure:
    name: Report nightly failure
    needs: [prepare, package, publish-plugins, handoff]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    # Only this job writes the tracking issue.
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'nightly-failure';
            const results = ${{ toJSON(needs) }};
            const failed = Object.entries(results)
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k);
            const body = [
              `The nightly build failed.`,
              ``,
              `- **Run:** ${runUrl}`,
              `- **Failed jobs:** ${failed.join(', ') || 'unknown'}`,
              `- **Commit:** ${context.sha}`,
              `- **Triggered by:** ${context.eventName}`,
            ].join('\n');

            // Ensure the label exists (ignore error if it already does).
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'b60205',
                description: 'Automated nightly build failure',
              });
            } catch (e) { /* label already exists */ }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 1,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: number, body,
              });
              core.notice(`Updated existing nightly-failure issue #${number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Nightly build failed (${new Date().toISOString().slice(0, 10)})`,
                body, labels: [label],
              });
              core.notice(`Opened nightly-failure issue #${created.data.number}`);
            }
