name: Cross-Platform FFI Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/*
      - release/*

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation in CI. Incremental artifacts
  # (target/debug/incremental) are large, change on every build, and bloat the
  # cached `target` directory, which can exhaust runner disk space on extraction.
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  ffi-test:
    name: FFI Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            lib_prefix: lib
            lib_ext: so
          - os: macos-latest
            name: macOS arm64
            lib_prefix: lib
            lib_ext: dylib
          - os: windows-latest
            name: Windows x86_64
            lib_prefix: ""
            lib_ext: dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Rust toolchain
        run: rustup show

      - name: Cache Cargo registry
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Cargo build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: target
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ffi-

      - name: Build and verify test plugins (cdylib)
        shell: bash
        run: |
          bash .github/scripts/build-test-plugins.sh "${{ matrix.lib_prefix }}" "${{ matrix.lib_ext }}"

      - name: Run host-sdk FFI integration tests
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: cargo test -p drasi-host-sdk --test integration_test -- --test-threads=1 --nocapture
