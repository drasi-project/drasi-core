name: Cross-Platform FFI Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/*
      - release/*

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation in CI. Incremental artifacts
  # (target/debug/incremental) are large, change on every build, and bloat the
  # cached `target` directory, which can exhaust runner disk space on extraction.
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  sdk-release-boundary:
    name: SDK package compatibility boundary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check compatibility line and release closure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/scripts/check-sdk-release.test.py
          python3 .github/scripts/check-sdk-release.py --base "$BASE_SHA"

  ffi-test:
    name: FFI Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            lib_prefix: lib
            lib_ext: so
          - os: macos-latest
            name: macOS arm64
            lib_prefix: lib
            lib_ext: dylib
          - os: windows-latest
            name: Windows x86_64
            lib_prefix: ""
            lib_ext: dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Rust toolchain
        run: rustup show

      - name: Cache Cargo registry
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Cargo build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: target
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ffi-

      - name: Build test plugins (cdylib)
        shell: bash
        run: |
          echo "=== Building cdylib test plugins ==="
          cargo build --lib -p drasi-source-mock --features drasi-source-mock/dynamic-plugin
          cargo build --lib -p drasi-reaction-log --features drasi-reaction-log/dynamic-plugin
          cargo build --lib -p drasi-reaction-sse --features drasi-reaction-sse/dynamic-plugin
          cargo build --lib -p drasi-reaction-snapshot-test
          cargo build --lib -p drasi-identity-test --features drasi-identity-test/dynamic-plugin
          cargo build --lib -p drasi-bootstrap-scriptfile --features drasi-bootstrap-scriptfile/dynamic-plugin
          cargo build --lib -p drasi-source-kubernetes --features drasi-source-kubernetes/dynamic-plugin
          cargo build --lib -p drasi-bootstrap-kubernetes --features drasi-bootstrap-kubernetes/dynamic-plugin

      - name: Copy plugins to test directory
        shell: bash
        run: |
          mkdir -p target/debug/plugins
          PREFIX="${{ matrix.lib_prefix }}"
          EXT="${{ matrix.lib_ext }}"
          for name in drasi_source_mock drasi_reaction_log drasi_reaction_sse drasi_reaction_snapshot_test drasi_identity_test drasi_bootstrap_scriptfile; do
            SRC="target/debug/${PREFIX}${name}.${EXT}"
            if [ -f "$SRC" ]; then
              cp "$SRC" target/debug/plugins/
              echo "  Copied: $SRC"
            else
              echo "  WARNING: Not found: $SRC"
            fi
          done

      - name: Verify test plugins exist
        shell: bash
        run: |
          PREFIX="${{ matrix.lib_prefix }}"
          EXT="${{ matrix.lib_ext }}"
          MISSING=0
          for name in drasi_source_mock drasi_reaction_log drasi_reaction_sse drasi_reaction_snapshot_test drasi_identity_test drasi_bootstrap_scriptfile; do
            FILE="target/debug/plugins/${PREFIX}${name}.${EXT}"
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Expected plugin not found: $FILE"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Available files in target/debug/plugins/:"
            ls -la target/debug/plugins/ || true
            exit 1
          fi
          echo "All 6 test plugins verified."

      - name: Run host-sdk FFI integration tests
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: cargo test -p drasi-host-sdk --test integration_test -- --test-threads=1 --nocapture

      - name: Check Kubernetes crypto initialization across cdylibs
        shell: bash
        run: |
          cargo test -p drasi-kubernetes-common --test client_crypto_provider
          cargo test -p drasi-host-sdk --test kubernetes_crypto_provider_test -- --ignored
          cargo test -p drasi-host-sdk --features registry --lib registry::resolver::tests
