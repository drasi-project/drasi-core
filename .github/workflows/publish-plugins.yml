name: Publish Plugins

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Pre-release label (e.g., "dev.1", "rc.1"). Leave empty for stable release.'
        required: false
        type: string
        default: ''
      tag:
        description: 'Fixed tag override (e.g. "drasi-nightly-test"). When set, overrides pre_release.'
        required: false
        type: string
        default: ''
      registry:
        description: 'OCI registry to publish to'
        required: false
        type: string
        default: 'ghcr.io/drasi-project'
      sign:
        description: 'Sign published plugins with cosign'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run only (no publishing)'
        required: false
        type: boolean
        default: false
      skip_visibility:
        description: 'Skip public package visibility checks (e.g. for nightly test runs)'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref/SHA to check out and build (default: the triggering ref)'
        required: false
        type: string
        default: ''
      repair_batch:
        description: 'Sign-only recovery inventory; none preserves normal publication'
        required: false
        type: choice
        default: 'none'
        options:
          - none
          - release-2026-09-25-darwin-arm64
      repair_action:
        description: 'Repair only: plan is read-only; execute explicitly authorizes signing'
        required: false
        type: choice
        default: 'plan'
        options:
          - plan
          - execute
  workflow_call:
    inputs:
      candidate_artifact:
        description: 'Prepared candidate artifact from this workflow run'
        required: false
        type: string
        default: ''
      candidate_sha256:
        description: 'SHA-256 of the prepared candidate manifest'
        required: false
        type: string
        default: ''
      pre_release:
        description: 'Pre-release label (e.g., "dev.1", "rc.1"). Leave empty for stable release.'
        required: false
        type: string
        default: ''
      tag:
        description: 'Fixed tag override (e.g. "drasi-nightly-test"). When set, overrides pre_release.'
        required: false
        type: string
        default: ''
      registry:
        description: 'OCI registry to publish to'
        required: false
        type: string
        default: 'ghcr.io/drasi-project'
      sign:
        description: 'Sign published plugins with cosign'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run only (no publishing)'
        required: false
        type: boolean
        default: false
      skip_visibility:
        description: 'Skip public package visibility checks (e.g. for nightly test runs)'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref/SHA to check out and build (default: the triggering ref)'
        required: false
        type: string
        default: ''
    secrets:
      PACKAGES_ADMIN_TOKEN:
        description: 'PAT classic with read:packages and organization access to verify public package visibility'
        required: false

permissions:
  packages: write
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  select-mode:
    name: Validate Publication or Repair Selection
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      certificate_identity: ${{ steps.select.outputs.certificate_identity }}
    steps:
      - name: Checkout workflow code, never the publication ref input
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate selection
        id: select
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 .github/scripts/release-candidate.py publication-context
          python3 .github/scripts/repair-plugin-signatures.py select

  prepare-candidate:
    name: Prepare one locked publication candidate
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ inputs.candidate_artifact || format('plugin-candidate-{0}-{1}', github.run_id, github.run_attempt) }}
      sha256: ${{ inputs.candidate_sha256 || steps.freeze.outputs.candidate_sha256 }}
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate candidate input pair
        env:
          ARTIFACT: ${{ inputs.candidate_artifact }}
          SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          if { [ -n "$ARTIFACT" ] && [ -z "$SHA256" ]; } || { [ -z "$ARTIFACT" ] && [ -n "$SHA256" ]; }; then
            echo "::error::Candidate artifact and hash must be provided together."
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Checkout trusted standalone source
        if: ${{ inputs.candidate_artifact == '' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: drasi-project/drasi-core
          ref: ${{ github.sha }}
          path: selected-source
          fetch-depth: 0
          persist-credentials: false

      - name: Select and freeze validated standalone source
        if: ${{ inputs.candidate_artifact == '' }}
        id: freeze
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          python3 .github/scripts/release-candidate.py select-source --root selected-source --ref "$INPUT_REF"
          python3 .github/scripts/release-candidate.py freeze --root selected-source --output candidate

      - name: Retain standalone candidate
        if: ${{ inputs.candidate_artifact == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90

      - name: Download caller candidate
        if: ${{ inputs.candidate_artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.candidate_artifact }}
          path: candidate

      - name: Validate caller candidate
        if: ${{ inputs.candidate_artifact != '' }}
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: python3 .github/scripts/release-candidate.py restore --bundle candidate --sha256 "$CANDIDATE_SHA256" --root selected-source

  repair-plan:
    name: Plan Plugin Signature Repair (read-only)
    needs: select-mode
    if: >-
      ${{ needs.select-mode.outputs.mode == 'plan' &&
          github.repository == 'drasi-project/drasi-core' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          github.workflow_ref == 'drasi-project/drasi-core/.github/workflows/publish-plugins.yml@refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main workflow commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: drasi-project/drasi-core
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.5.2'

      - name: Validate complete inventory and signatures (no login or signing)
        id: repair
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: python3 .github/scripts/repair-plugin-signatures.py plan

      - name: Retain repair plan or failure report
        if: ${{ always() && steps.repair.outputs.report != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-signature-repair-plan
          path: ${{ steps.repair.outputs.report }}
          if-no-files-found: error
          retention-days: 30

  repair-execute:
    name: Execute Plugin Signature Repair
    needs: select-mode
    if: >-
      ${{ needs.select-mode.outputs.mode == 'execute' &&
          inputs.repair_action == 'execute' &&
          inputs.repair_batch == 'release-2026-09-25-darwin-arm64' &&
          github.repository == 'drasi-project/drasi-core' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          github.workflow_ref == 'drasi-project/drasi-core/.github/workflows/publish-plugins.yml@refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: plugin-signature-repair-${{ inputs.repair_batch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main workflow commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: drasi-project/drasi-core
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.5.2'

      - name: Revalidate inventory, sign missing signatures, and verify anonymously
        id: repair
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          REPAIR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/repair-plugin-signatures.py execute

      - name: Retain repair result or failure report
        if: ${{ always() && steps.repair.outputs.report != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-signature-repair-execute
          path: ${{ steps.repair.outputs.report }}
          if-no-files-found: error
          retention-days: 30

  visibility-preflight:
    name: Verify Plugin Directory Is Public
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify plugin directory is public (read-only)
        if: ${{ !inputs.dry_run && !inputs.skip_visibility }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          directory="$(python3 .github/scripts/release-candidate.py packages --registry "$INPUT_REGISTRY")"
          registry_path="${INPUT_REGISTRY#ghcr.io/}"
          export PACKAGE_VISIBILITY_ORG="${registry_path%%/*}"
          .github/scripts/package-visibility.sh verify-public "$directory"

  list-plugin-packages:
    name: List Plugin Packages
    needs: [select-mode, visibility-preflight, prepare-candidate]
    if: ${{ needs.select-mode.outputs.mode == 'publish' && !inputs.dry_run && !inputs.skip_visibility }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Download prepared inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare-candidate.outputs.artifact }}
          path: candidate

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: List plugin packages
        id: list
        env:
          INPUT_REGISTRY: ${{ inputs.registry }}
          CANDIDATE_SHA256: ${{ needs.prepare-candidate.outputs.sha256 }}
        run: |
          python3 .github/scripts/release-candidate.py packages --bundle candidate \
            --sha256 "$CANDIDATE_SHA256" --registry "$INPUT_REGISTRY" > "$RUNNER_TEMP/plugin-packages"
          {
            echo "packages<<EOF"
            cat "$RUNNER_TEMP/plugin-packages"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build & Publish (${{ matrix.arch_suffix }})
    needs: [select-mode, visibility-preflight, prepare-candidate]
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    runs-on: ${{ matrix.os }}
    env:
      CANDIDATE_SHA256: ${{ needs.prepare-candidate.outputs.sha256 }}
    defaults:
      run:
        working-directory: prepared
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest-8-cores
            arch_suffix: linux-amd64
            # Build with the glibc 2.28 ABI promised by the published -gnu
            # artifacts, instead of the host runner's newer glibc.
            manylinux: true
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
            glibc: '2.28'
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            arch_suffix: linux-arm64
            manylinux: true
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514
            glibc: '2.28'
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest-8-cores
            arch_suffix: linux-musl-amd64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest-8-cores
            arch_suffix: linux-musl-arm64
            cross: true
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest-8-cores
            arch_suffix: windows-amd64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch_suffix: windows-msvc-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            arch_suffix: darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            arch_suffix: darwin-arm64

    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download prepared candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare-candidate.outputs.artifact }}
          path: candidate

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Restore and validate prepared source
        id: restore
        shell: bash
        working-directory: .
        run: python .github/scripts/release-candidate.py restore --bundle candidate --sha256 "$CANDIDATE_SHA256" --root prepared

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.manylinux
        run: |
          # The Microsoft apt repos preinstalled on GitHub runners intermittently
          # serve a broken InRelease signature (NOSPLIT), failing apt-get update.
          # We don't use them, so remove before updating.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo apt-get update
          # The Kafka plugins bundle a minimal static librdkafka. On every Linux
          # target the build now forces WITH_CURL/SSL=0 (cross targets via their
          # Docker toolchain fragments and the manylinux -gnu build use
          # CMAKE_TOOLCHAIN_FILE=ci/cmake/librdkafka-features.cmake, so no host
          # curl/openssl is needed.
          sudo apt-get install -y jq libjq-dev protobuf-compiler cmake

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq protobuf cmake

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc -y
          choco install cmake -y --installargs 'ADD_CMAKE_TO_PATH=System'
          vcpkg install openssl:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Set JQ_LIB_DIR (Linux)
        if: runner.os == 'Linux' && !matrix.manylinux
        # $(uname -m) is x86_64 on amd64 runners and aarch64 on arm64 runners,
        # which matches the Debian multiarch lib path on both.
        run: echo "JQ_LIB_DIR=/usr/lib/$(uname -m)-linux-gnu" >> "$GITHUB_ENV"

      - name: Set JQ_LIB_DIR (macOS)
        if: runner.os == 'macOS'
        run: echo "JQ_LIB_DIR=$(brew --prefix jq)/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup show

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.4

      - name: Install cosign
        # OCI pushes authenticate separately; cosign is required for signed publication.
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        # cosign login only writes docker config for cosign's own signing pushes;
        # the plugin publish uses explicit env credentials, so this is only
        # required on the signing path.
        if: ${{ inputs.sign && !inputs.dry_run }}
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build plugins
        shell: bash
        env:
          DRASI_BUILD_GIT_SHA: ${{ steps.restore.outputs.source_commit }}
        run: |
          if [ "${{ matrix.manylinux }}" = "true" ]; then
            docker run --rm \
              --env DRASI_BUILD_GIT_SHA \
              --env HOST_UID="$(id -u)" \
              --env HOST_GID="$(id -g)" \
              --volume "${PWD}:/workspace" \
              --workdir /workspace \
              "${{ matrix.manylinux_image }}" \
              bash ci/scripts/build-plugins-manylinux.sh "${{ matrix.target }}"
          else
            cargo run --locked -p xtask -- build-plugins --release --target "${{ matrix.target }}"
          fi

      - name: Verify glibc floor (-gnu plugins)
        if: matrix.manylinux
        shell: bash
        # Guard against glibc-floor regressions: assert every built -gnu plugin's
        # highest required GLIBC symbol is <= the agreed floor. Fails the release
        # otherwise so a stray high-glibc dependency can't ship silently.
        # See drasi-project/drasi-core#601.
        env:
          GLIBC_FLOOR: ${{ matrix.glibc }}
        run: |
          set -euo pipefail
          command -v objdump >/dev/null 2>&1 || { echo "::error::objdump not found (install binutils)"; exit 1; }
          PLUGINS_DIR="target/${{ matrix.target }}/release/plugins"
          if [ ! -d "$PLUGINS_DIR" ]; then
            echo "::error::Plugins directory not found: $PLUGINS_DIR"
            exit 1
          fi

          # Highest glibc symbol we tolerate, as a sortable version.
          FLOOR="GLIBC_${GLIBC_FLOOR}"
          FAILED=0
          shopt -s nullglob
          for so in "$PLUGINS_DIR"/*.so; do
            MAX=$(objdump -T "$so" 2>/dev/null \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | sort -V | tail -1 || true)
            if [ -z "$MAX" ]; then
              echo "OK   $(basename "$so"): no GLIBC version symbols"
              continue
            fi
            HIGHEST=$(printf '%s\n%s\n' "$FLOOR" "$MAX" | sort -V | tail -1)
            if [ "$HIGHEST" != "$FLOOR" ]; then
              echo "::error::$(basename "$so") requires $MAX (> floor $FLOOR)"
              FAILED=1
            else
              echo "OK   $(basename "$so"): max $MAX (<= $FLOOR)"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more -gnu plugins exceed the glibc floor $FLOOR."
            exit 1
          fi

      - name: Check frozen inputs before publication
        shell: bash
        working-directory: .
        run: python .github/scripts/release-candidate.py check --bundle candidate --sha256 "$CANDIDATE_SHA256" --root prepared

      - name: Publish plugins (per-architecture tag)
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          OCI_REGISTRY_USERNAME: ${{ github.actor }}
          OCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # Pass free-form inputs through the environment (not string-interpolated
          # into the script body) so their values can't alter the command.
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRE_RELEASE: ${{ inputs.pre_release }}
          INPUT_SIGN: ${{ inputs.sign }}
          TARGET: ${{ matrix.target }}
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
          COSIGN_VERIFY_CERTIFICATE_IDENTITY: ${{ needs.select-mode.outputs.certificate_identity }}
          COSIGN_VERIFY_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          # Never redirect signatures into a different package namespace.
          COSIGN_REPOSITORY: ''
        run: |
          # Defence in depth: reject anything outside the expected charset before
          # the value reaches the command line.
          if [ -n "$INPUT_TAG" ] && ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid tag format: $INPUT_TAG" >&2; exit 1
          fi
          if [ -n "$INPUT_PRE_RELEASE" ] && ! [[ "$INPUT_PRE_RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid pre_release format: $INPUT_PRE_RELEASE" >&2; exit 1
          fi
          if ! [[ "$INPUT_REGISTRY" =~ ^[A-Za-z0-9._/:-]+$ ]]; then
            echo "Invalid registry format: $INPUT_REGISTRY" >&2; exit 1
          fi
          # Build the args as an array so each element is passed verbatim (no
          # word-splitting or globbing).
          ARGS=(--release --target "$TARGET" --registry "$INPUT_REGISTRY" --arch-suffix "$ARCH_SUFFIX" --report publication.json)
          if [ "$INPUT_SIGN" = "true" ]; then
            ARGS+=(--sign)
          fi
          # --tag and --pre-release are mutually exclusive; --tag wins when set.
          if [ -n "$INPUT_TAG" ]; then
            ARGS+=(--tag "$INPUT_TAG")
          elif [ -n "$INPUT_PRE_RELEASE" ]; then
            ARGS+=(--pre-release "$INPUT_PRE_RELEASE")
          fi
          cargo run --locked -p xtask -- publish-plugins "${ARGS[@]}"

      - name: Bind publication results to the candidate
        if: ${{ !inputs.dry_run }}
        shell: bash
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p reports
          python .github/scripts/release-candidate.py target-report --bundle candidate \
            --sha256 "$CANDIDATE_SHA256" --root prepared --report prepared/publication.json \
            --target "$TARGET" --output "reports/$TARGET.json"

      - name: Retain target publication report
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: reports/*.json
          if-no-files-found: error

      - name: Retain partial publication diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: prepared/publication.json
          if-no-files-found: ignore

      - name: Publish plugins (dry run)
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRE_RELEASE: ${{ inputs.pre_release }}
          TARGET: ${{ matrix.target }}
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
        run: |
          if [ -n "$INPUT_TAG" ] && ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid tag format: $INPUT_TAG" >&2; exit 1
          fi
          if [ -n "$INPUT_PRE_RELEASE" ] && ! [[ "$INPUT_PRE_RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid pre_release format: $INPUT_PRE_RELEASE" >&2; exit 1
          fi
          if ! [[ "$INPUT_REGISTRY" =~ ^[A-Za-z0-9._/:-]+$ ]]; then
            echo "Invalid registry format: $INPUT_REGISTRY" >&2; exit 1
          fi
          ARGS=(--release --target "$TARGET" --registry "$INPUT_REGISTRY" --arch-suffix "$ARCH_SUFFIX" --dry-run)
          if [ -n "$INPUT_TAG" ]; then
            ARGS+=(--tag "$INPUT_TAG")
          elif [ -n "$INPUT_PRE_RELEASE" ]; then
            ARGS+=(--pre-release "$INPUT_PRE_RELEASE")
          fi
          cargo run --locked -p xtask -- publish-plugins "${ARGS[@]}"

      - name: Verify candidate remained unchanged
        shell: bash
        working-directory: .
        run: python .github/scripts/release-candidate.py check --bundle candidate --sha256 "$CANDIDATE_SHA256" --root prepared

  verify-public-visibility:
    name: Verify Public Package Visibility
    needs:
      - select-mode
      - build-and-publish
      - list-plugin-packages
    # Skipped on dry runs and when skip_visibility is set (e.g. nightly test runs,
    # where the packages are already pullable and visibility verification is omitted).
    if: ${{ needs.select-mode.outputs.mode == 'publish' && !inputs.dry_run && !inputs.skip_visibility }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Verify packages are public (read-only)
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
          PACKAGE_NAMES: ${{ needs.list-plugin-packages.outputs.packages }}
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          registry_path="${INPUT_REGISTRY#ghcr.io/}"
          export PACKAGE_VISIBILITY_ORG="${registry_path%%/*}"
          mapfile -t packages <<< "$PACKAGE_NAMES"
          .github/scripts/package-visibility.sh verify-public "${packages[@]}"
