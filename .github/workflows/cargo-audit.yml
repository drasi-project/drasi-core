name: Cargo Audit

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1' # runs every Monday at 01:30 UTC

jobs:
  audit:
    uses: drasi-project/.github/.github/workflows/cargo-audit.yaml@main
    with:
      # Tiberius 0.12.3's optional rustls backend (exposed by
      # drasi-reaction-storedproc-mssql/rustls) pins tokio-rustls 0.24, rustls
      # 0.21.12, and rustls-webpki 0.101.7. No patched Tiberius release is
      # available; the default MSSQL backend uses native-tls instead.
      # RUSTSEC-2026-0098/0099/0104 cover this legacy TLS stack.
      # RUSTSEC-2026-0346: TLS secrets exposed by client-session Debug impls.
      # RUSTSEC-2026-0349: ServerHello can downgrade later key exchanges.
      # RUSTSEC-2026-0382: acceptance of distrusted intermediate certificates.
      # These exceptions also cover opt-in builds; do not enable that backend
      # for untrusted endpoints pending an upstream TLS upgrade or driver migration.
      # 0382 also affects modern webpki; keep its locked version >= 0.103.16.
      #
      # quick-xml < 0.41 DoS advisories:
      #   RUSTSEC-2026-0194 (quadratic duplicate-attribute-name check)
      #   RUSTSEC-2026-0195 (unbounded namespace allocation in NsReader)
      # Both fixed in quick-xml >= 0.41. quick-xml enters the tree from multiple
      # sources: as a direct dependency of drasi-source-http (0.37) and
      # drasi-bootstrap-http (0.31), and transitively via azure_core 0.21.0, which
      # pins "^0.31" (pulled in by drasi-reaction-azure-storage). Bumping our direct
      # deps alone would not remove the azure_core-pinned 0.31.0, so clearing these
      # fully requires a major Azure SDK upgrade. These are DoS advisories in the
      # XML parser used by the optional HTTP/Azure source/bootstrap plugins, whose
      # input may come from external endpoints; accepted as a known risk pending
      # the Azure SDK upgrade.
      # RUSTSEC-2026-0275 (medium): legacy azure_core 0.21.0 writes the
      # `authorization` header value to logs. Pulled in transitively by
      # drasi-reaction-azure-storage via the azure_storage_* 0.21 family; the
      # fix (azure_core >= 0.22) requires the same major Azure SDK upgrade noted
      # above. Accepted as a known risk pending that upgrade — the affected code
      # path is the optional Azure storage reaction plugin.
      audit-args: >-
        --ignore RUSTSEC-2026-0098
        --ignore RUSTSEC-2026-0099
        --ignore RUSTSEC-2026-0104
        --ignore RUSTSEC-2026-0194
        --ignore RUSTSEC-2026-0195
        --ignore RUSTSEC-2026-0275
        --ignore RUSTSEC-2026-0346
        --ignore RUSTSEC-2026-0349
        --ignore RUSTSEC-2026-0382