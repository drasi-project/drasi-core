name: Cargo Audit

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1' # runs every Monday at 01:30 UTC

jobs:
  audit:
    uses: drasi-project/.github/.github/workflows/cargo-audit.yaml@main
    with:
      # Existing legacy-Azure exceptions remain limited to the reviewed storage
      # clients. SharedKey/Table support still requires azure_core 0.21:
      # - 0194: quick-xml 0.41 preflight rejects duplicate/excessive attributes
      #   before legacy service-metadata parsing; blob content stays streamed.
      # - 0195: the affected NsReader path is not used by Azure deserialization.
      # - 0275: a per-call transport policy keeps SDK authentication/TLS intact
      #   and redacts authorization before retry/success/cancellation logging.
      # HTTP webhook/bootstrap paths use quick-xml 0.41 directly.
      # See components/reactions/azure-storage/README.md for the exact boundary.
      # Other retained findings remain visible; no new exceptions are added here.
      audit-args: >-
        --ignore RUSTSEC-2026-0194
        --ignore RUSTSEC-2026-0195
        --ignore RUSTSEC-2026-0275