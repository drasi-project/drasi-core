version = 1

[analysis]
manifest_path = "Cargo.toml"
packages = [
    "drasi-ffi-primitives",
    "drasi-lib",
    "drasi-query-ast",
    "drasi-query-cypher",
    "drasi-query-gql",
]
target_kinds = ["library"]
incomplete = "deny"
proc_macros = true
build_scripts = true

[selectors.ffi]
packages = ["drasi-ffi-primitives"]

[selectors.runtime]
packages = ["drasi-lib"]

[selectors.ast]
packages = ["drasi-query-ast"]

[selectors.parsers]
packages = ["drasi-query-cypher", "drasi-query-gql"]

[selectors.evaluation]
packages = ["drasi-core", "drasi-functions-cypher", "drasi-functions-gql", "drasi-lib"]

[selectors.external-parsers]
external_crates = ["drasi_query_cypher", "drasi_query_gql"]

[selectors.external-evaluation]
external_crates = ["drasi_core", "drasi_functions_cypher", "drasi_functions_gql", "drasi_lib"]

[selectors.indexes]
packages = ["drasi-index-garnet", "drasi-index-rocksdb"]

[selectors.external-indexes]
external_crates = ["drasi_index_garnet", "drasi_index_rocksdb"]

