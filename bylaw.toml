[[rule]]
id = "ffi-is-std-only"
kind = "only-dependencies"
from = "ffi"
allowed = ["ffi"]
scope = "both"
allow_toolchain = true
allow_self = true
because = "FFI primitives must not pull in domain types or third-party dependencies."

[[rule]]
id = "runtime-does-not-depend-on-plugins"
kind = "forbid-dependencies"
from = "runtime"
to = ["plugins", "external-plugins"]
scope = "both"
because = "Concrete plugins depend on the embedded runtime, never the reverse."

[[rule]]
id = "runtime-does-not-depend-on-indexes"
kind = "forbid-dependencies"
from = "runtime"
to = ["indexes", "external-indexes"]
scope = "both"
because = "Index backends are injected; the RocksDB dev-dependency only tests injection."

[[rule]]
id = "ast-does-not-depend-on-upper-layers"
kind = "forbid-dependencies"
from = "ast"
to = ["parsers", "external-parsers", "evaluation", "external-evaluation", "plugins", "external-plugins", "indexes", "external-indexes"]
scope = "both"
because = "The shared AST is independent of parsing, evaluation, and concrete adapters."

[[rule]]
id = "parsers-do-not-depend-on-upper-layers"
kind = "forbid-dependencies"
from = "parsers"
to = ["evaluation", "external-evaluation", "plugins", "external-plugins", "indexes", "external-indexes"]
scope = "both"
because = "Language parsers produce the shared AST without depending on evaluation or adapters."
