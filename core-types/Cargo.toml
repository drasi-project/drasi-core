[package]
rust-version.workspace = true
name = "drasi-core-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Drasi graph and query value definitions without query execution"
readme = "README.md"

[features]
openapi = ["dep:utoipa"]

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
drasi-query-ast = { workspace = true }
futures-core = "0.3"
itoa = "1"
lazy_static = "1"
log = "0.4"
ordered-float = { version = "3", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["std", "parsing", "macros", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
utoipa = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
bincode = "1.3"
rmp-serde = "1"
tokio = { version = "1", features = ["rt", "macros"] }
