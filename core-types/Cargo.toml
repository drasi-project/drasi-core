[package]
name = "drasi-core-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Drasi graph and query value definitions without query execution"
readme = "README.md"

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
drasi-query-ast = { workspace = true }
itoa = "1"
lazy_static = "1"
log = "0.4"
ordered-float = { version = "3", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["std", "parsing", "macros", "serde"] }

[lints]
workspace = true

[dev-dependencies]
rmp-serde = "1"
