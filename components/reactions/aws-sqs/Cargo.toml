[package]
name = "drasi-reaction-aws-sqs"
version = "0.1.3"
edition = "2021"
authors = ["Drasi Project"]
description = "AWS SQS reaction plugin for Drasi"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "plugin", "reaction", "aws", "sqs"]
categories = ["network-programming"]

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
drasi-lib.workspace = true
drasi-core.workspace = true
drasi-plugin-sdk = { workspace = true }
utoipa = { workspace = true }
anyhow = "1.0"
async-trait = "0.1"
# Keep the AWS SDK on the smithy-json 0.63 / smithy-types 1.6 line.
# aws-config 1.12 still depends on smithy-json 0.63, while aws-sdk-sqs 1.110+
# requires smithy-types 1.7, and those two do not compile together.
aws-config = { version = "~1.12", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-sqs = { version = "~1.109", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = ">=1.6.3, <1.7"
chrono = "0.4"
handlebars = "5.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
drasi-source-application.workspace = true
env_logger = "0.11"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["elasticmq"] }

[features]
dynamic-plugin = []
