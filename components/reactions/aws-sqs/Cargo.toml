[package]
name = "drasi-reaction-aws-sqs"
version = "0.1.3"
edition = "2021"
authors = ["Drasi Project"]
description = "AWS SQS reaction plugin for Drasi"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "plugin", "reaction", "aws", "sqs"]
categories = ["network-programming"]

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
drasi-lib.workspace = true
drasi-core.workspace = true
drasi-plugin-sdk = { workspace = true }
utoipa = { workspace = true }
anyhow = "1.0"
async-trait = "0.1"
# Keep the SDK and Smithy release families aligned with the AWS identity plugin.
# These releases require Rust 1.94.1 (the workspace uses Rust 1.95).
aws-config = { version = "=1.13.0", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-sqs = { version = "=1.118.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-runtime = "=1.10.2"
aws-sigv4 = "1.6.4"
aws-smithy-runtime = "=1.16.2"
aws-smithy-types = "=1.9.1"
chrono = "0.4"
handlebars = "5.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
drasi-source-application.workspace = true
env_logger = "0.11"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["elasticmq"] }

[features]
dynamic-plugin = []
