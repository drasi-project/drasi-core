[package]
name = "drasi-reaction-github-project-item-refresh"
version = "0.1.0"
edition = "2021"
authors = ["Drasi Project"]
description = "GitHub ProjectV2 item status refresh reaction plugin for Drasi"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "plugin", "reaction", "github", "projectv2"]
categories = ["network-programming"]

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
drasi-lib.workspace = true
drasi-plugin-sdk = { workspace = true }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
utoipa = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
drasi-core.workspace = true
drasi-source-application.workspace = true
env_logger = "0.11"
tokio = { version = "1.0", features = ["full", "test-util"] }
tokio-test = "0.4"
wiremock = "0.6"

[features]
dynamic-plugin = []
