[package]
name = "drasi-reaction-temporal"
version = "0.1.0"
edition = "2021"
authors = ["Drasi Project"]
description = "Configurable Temporal workflow actions for Drasi query diffs"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "plugin", "reaction", "temporal"]
categories = ["network-programming"]

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
dynamic-plugin = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
drasi-lib.workspace = true
drasi-plugin-sdk.workspace = true
futures-util = "0.3"
handlebars = "5.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporalio-client = "1.1"
temporalio-common = "1.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
utoipa.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
