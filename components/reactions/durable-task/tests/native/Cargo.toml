[package]
name = "durable-task-recovery-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bincode = "1.3"
drasi-bootstrap-postgres = { path = "../../../../../components/bootstrappers/postgres" }
drasi-index-rocksdb = { path = "../../../../../components/indexes/rocksdb" }
drasi-lib = { path = "../../../../../lib" }
drasi-plugin-sdk = { path = "../../../../../components/plugin-sdk" }
drasi-reaction-durable-task = { path = "../.." }
drasi-source-postgres = { path = "../../../../../components/sources/postgres" }
drasi-state-store-redb = { path = "../../../../../components/state_stores/redb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-std", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
