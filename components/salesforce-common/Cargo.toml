[package]
name = "drasi-salesforce-common"
version = "0.1.0"
edition = "2021"
authors = ["Drasi Project"]
description = "Shared Salesforce mapping/auth/protocol primitives for Drasi source plugins"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "salesforce", "source", "bootstrap"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
drasi-core.workspace = true
drasi-lib.workspace = true
anyhow = "1.0"
apache-avro = { version = "0.20", default-features = false }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
diffy = "0.4"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
drasi-reaction-application.workspace = true
drasi-source-application.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
wiremock = "0.6"
