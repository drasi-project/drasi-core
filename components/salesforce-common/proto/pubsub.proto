// Wire-compatible subscriber subset of Salesforce's public Pub/Sub API:
// https://github.com/forcedotcom/pub-sub-api/blob/main/pubsub_api.proto
syntax = "proto3";
package eventbus.v1;

service PubSub {
  rpc GetTopic(TopicRequest) returns (TopicInfo);
  rpc GetSchema(SchemaRequest) returns (SchemaInfo);
  rpc Subscribe(stream FetchRequest) returns (stream FetchResponse);
}

message TopicRequest { string topic_name = 1; }
message TopicInfo {
  string topic_name = 1;
  string tenant_guid = 2;
  bool can_publish = 3;
  bool can_subscribe = 4;
  string schema_id = 5;
  string rpc_id = 6;
}
message SchemaRequest { string schema_id = 1; }
message SchemaInfo {
  string schema_json = 1;
  string schema_id = 2;
  string rpc_id = 3;
}
message EventHeader {
  string key = 1;
  bytes value = 2;
}
message ProducerEvent {
  string id = 1;
  string schema_id = 2;
  bytes payload = 3;
  repeated EventHeader headers = 4;
}
message ConsumerEvent {
  ProducerEvent event = 1;
  bytes replay_id = 2;
}
enum ReplayPreset {
  LATEST = 0;
  EARLIEST = 1;
  CUSTOM = 2;
}
message FetchRequest {
  string topic_name = 1;
  ReplayPreset replay_preset = 2;
  bytes replay_id = 3;
  int32 num_requested = 4;
  string auth_refresh = 5;
}
message FetchResponse {
  repeated ConsumerEvent events = 1;
  bytes latest_replay_id = 2;
  string rpc_id = 3;
  int32 pending_num_requested = 4;
}
