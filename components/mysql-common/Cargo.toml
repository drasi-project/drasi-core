[package]
name = "drasi-mysql-common"
version = "0.2.9"
edition = "2021"
authors = ["Drasi Project"]
description = "Shared types for MySQL source and bootstrap plugins"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "mysql", "common"]
categories = ["database"]

[lints]
workspace = true

[features]
# Enables serde/OpenAPI DTOs (e.g. SslModeDto) for plugin descriptors. Only the
# descriptor crates need this, so utoipa stays optional.
api = ["dep:utoipa"]
native = [
    "dep:drasi-computation-contracts", "dep:async-trait", "dep:bytes", "dep:encoding_rs",
    "dep:futures-util", "dep:mysql_common", "dep:native-tls",
    "dep:tokio", "dep:tokio-native-tls", "dep:rsa", "dep:sha1", "dep:sha2",
]
storedproc = ["dep:handlebars", "dep:drasi-reaction-common"]

[dependencies]
drasi-core-types.workspace = true
drasi-computation-contracts = { workspace = true, optional = true }
drasi-reaction-common = { workspace = true, optional = true }
anyhow = "1.0"
log = "0.4"
# A rustls TLS backend (+ ring crypto provider) is always compiled in so every
# SslMode works in shipped plugins (which are built without extra features).
# rustls is pure Rust, so this needs no system OpenSSL.
mysql_async = { version = "0.37", features = ["rustls-tls", "ring", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ordered-float = "3.0"
utoipa = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
encoding_rs = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true }
mysql_common = { version = "0.37", features = ["binlog"], optional = true }
native-tls = { version = "0.2", optional = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"], optional = true }
tokio-native-tls = { version = "0.3", optional = true }
rsa = { version = "0.9", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
handlebars = { version = "5.1", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt", "net"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mysql"] }
rcgen = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
