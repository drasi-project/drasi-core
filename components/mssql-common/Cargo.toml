[package]
name = "drasi-mssql-common"
version = "0.2.11"
edition = "2021"
authors = ["Drasi Project"]
description = "Shared SQL Server connection, mapping and command helpers"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "mssql", "common"]
categories = ["database"]

[lints]
workspace = true

[features]
default = ["native-tls", "tiberius/winauth"]
native-tls = ["tiberius/native-tls"]
rustls = ["tiberius/rustls"]
sql = ["dep:drasi-computation-contracts", "dep:drasi-reaction-common", "dep:handlebars", "dep:serde_json"]
native = ["dep:drasi-computation-contracts", "dep:serde_json", "dep:sha2", "dep:futures-util", "dep:bytes", "tokio/rt", "tokio/sync", "tokio/time", "tokio/macros"]

[dependencies]
drasi-core-types.workspace = true
drasi-computation-contracts = { workspace = true, optional = true }
drasi-reaction-common = { workspace = true, optional = true }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "chrono", "rust_decimal"] }
tokio = { version = "1.0", features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rust_decimal = "1.34"
ordered-float = "3.7.0"
hex = "0.4"
handlebars = { version = "5.1", optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
futures-util = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
# native-tls uses OpenSSL only on Linux (Windows: SChannel, macOS: Secure
# Transport). Vendor it there so the glibc-pinned manylinux -gnu plugins
# build without host OpenSSL headers; scoping it off Windows/macOS avoids
# unnecessary and toolchain-sensitive OpenSSL-from-source builds.
openssl = { version = "0.10", features = ["vendored"] }
