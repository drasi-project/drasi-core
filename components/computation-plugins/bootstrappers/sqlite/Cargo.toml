[package]
name = "drasi-computation-bootstrap-sqlite"
description = "Native SQLite read-only file bootstrap provider"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "bootstrap-sqlite"

[dependencies]
drasi-computation-contracts.workspace = true
drasi-computation-plugin-sdk.workspace = true
drasi-core-types.workspace = true
drasi-sqlite-common.workspace = true
anyhow = "1"
async-trait = "0.1"
bincode = "1.3"
chrono = "0.4"
futures = "0.3"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
