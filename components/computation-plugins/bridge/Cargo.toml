[package]
name = "drasi-computation-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded native inter-instance ComputationGraph sources and sinks"
readme = "README.md"

[dependencies]
drasi-core = { workspace = true }
drasi-lib = { workspace = true }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
rmp-serde = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
bincode = "1"
chrono = "0.4"
drasi-index-rocksdb = { workspace = true, features = ["computation"] }

[lints]
workspace = true
