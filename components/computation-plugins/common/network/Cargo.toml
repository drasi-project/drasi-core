[package]
rust-version.workspace = true
name = "drasi-computation-network-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared native network configuration, admission and wire helpers; no component factories"
readme = "README.md"

[features]
default = []
# An HTTP/TLS listener with bearer-token authentication, rate limiting and
# connection limits, shared by the HTTP source and the SSE sink.
listener = ["dep:rustls", "dep:rustls-pemfile", "dep:subtle", "dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio-rustls", "dep:tower"]
ingress = ["listener", "dep:drasi-http-common", "drasi-http-common/adaptive"]
http-source = ["ingress", "dep:drasi-http-common"]
# The connection-limited, TLS-capable incoming stream for tonic servers.
grpc-listener = ["listener", "dep:tonic", "dep:async-stream"]
grpc-source = ["ingress", "grpc-listener", "dep:drasi-grpc-common", "drasi-grpc-common/source", "dep:prost-types"]
sink = ["dep:rustls-pemfile"]
http-sink = ["sink", "dep:reqwest", "dep:drasi-http-common", "drasi-http-common/adaptive"]
grpc-sink = ["sink", "dep:drasi-grpc-common", "drasi-grpc-common/reaction", "dep:reqwest", "dep:drasi-http-common", "drasi-http-common/adaptive"]

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-core-types = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-http-common = { workspace = true, optional = true }
drasi-grpc-common = { workspace = true, optional = true }
anyhow = "1"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
subtle = { version = "2", optional = true }
axum = { version = "0.7", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
chrono = "0.4"
futures-util = "0.3"
prost-types = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true }
async-stream = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[lints]
workspace = true
