[package]
rust-version.workspace = true
name = "drasi-computation-storedproc-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The destination-cursor delivery protocol shared by the native stored-procedure sinks; no database driver"
readme = "README.md"

[features]
default = []
# The cross-backend protocol table and an in-memory session, for tests.
conformance = ["tokio/net", "tokio/io-util", "tokio/rt", "tokio/sync", "tokio/macros"]

[dependencies]
drasi-computation-contracts = { workspace = true }
drasi-reaction-common = { workspace = true }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "net", "io-util", "sync"] }

[lints]
workspace = true
