[package]
name = "drasi-computation-transformer-arithmetic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph arithmetic transformer and transaction participant"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "transformer-arithmetic"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-core = { workspace = true }
drasi-lib = { workspace = true }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
