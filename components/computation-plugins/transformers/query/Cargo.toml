[package]
rust-version.workspace = true
name = "drasi-computation-transformer-query"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimental native continuous query transformer"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["middleware-map", "middleware-relabel", "middleware-unwind", "middleware-promote", "middleware-parse-json", "middleware-decoder"]
dynamic-plugin = []
middleware-map = ["drasi-middleware/map"]
middleware-relabel = ["drasi-middleware/relabel"]
middleware-unwind = ["drasi-middleware/unwind"]
middleware-promote = ["drasi-middleware/promote"]
middleware-parse-json = ["drasi-middleware/parse_json"]
middleware-decoder = ["drasi-middleware/decoder"]
middleware-jq = ["drasi-middleware/jq"]
middleware-bundled-jq = ["middleware-jq", "drasi-middleware/bundled-jq"]
middleware-all = ["middleware-map", "middleware-relabel", "middleware-unwind", "middleware-promote", "middleware-parse-json", "middleware-decoder", "middleware-jq"]

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "3.0.0"
kind = "transformer-query"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
chrono = "0.4"
drasi-computation-contracts = { workspace = true }
drasi-query-common = { workspace = true }
drasi-computation-plugin-sdk = { workspace = true }
drasi-core = { workspace = true }
futures-util = "0.3"
im = { workspace = true }
log = "0.4"
ordered-float = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
drasi-middleware = { workspace = true, features = ["engine-adapter"] }

[lints]
workspace = true
