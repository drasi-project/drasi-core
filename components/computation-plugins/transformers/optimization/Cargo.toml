[package]
rust-version.workspace = true
name = "drasi-computation-transformer-optimization"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph mixed-integer optimization transformer"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "0.2.0"
kind = "transformer-optimization"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-core-types = { workspace = true }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
good_lp = { version = "=1.15.0", default-features = false, features = ["microlp"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
drasi-computation-plugin-sdk = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
