[package]
rust-version.workspace = true
name = "drasi-computation-transformer-geometry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph planar geometry transformer"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "5.0.0"
kind = "transformer-geometry"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-core-types = { workspace = true }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = "0.31"

[dev-dependencies]
drasi-computation-plugin-sdk = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[lints]
workspace = true
