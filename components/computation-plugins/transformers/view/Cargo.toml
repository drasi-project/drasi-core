[package]
rust-version.workspace = true
name = "drasi-computation-transformer-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph stateful, memory-backed view transformer"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "2.0.0"
kind = "transformer-view"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-core-types = { workspace = true }
drasi-middleware = { workspace = true, features = ["map", "relabel"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
im = { workspace = true }

[dev-dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[lints]
workspace = true
