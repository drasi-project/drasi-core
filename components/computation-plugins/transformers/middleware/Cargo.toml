[package]
name = "drasi-computation-transformer-middleware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph map and relabel middleware transformer"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "transformer-middleware"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-core = { workspace = true }
drasi-lib = { workspace = true }
drasi-middleware = { workspace = true, features = ["map", "relabel"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
