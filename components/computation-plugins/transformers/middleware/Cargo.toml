[package]
rust-version.workspace = true
name = "drasi-computation-transformer-middleware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph stateless and stateful middleware transformers"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "0.2.0"
kind = "transformer-middleware"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-core-types = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-computation-middleware-common = { workspace = true }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
im = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
