[package]
name = "drasi-computation-network"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph HTTP and gRPC ingress and query-output delivery"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "network"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-core = { workspace = true }
drasi-lib = { workspace = true }
# Reuse only protocol DTOs, conversion helpers and generated service definitions.
drasi-source-http = { version = "0.2.12", path = "../../sources/http" }
drasi-source-grpc = { version = "0.2.11", path = "../../sources/grpc" }
drasi-reaction-grpc = { workspace = true }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.7"
chrono = "0.4"
futures-util = "0.3"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"

[dev-dependencies]
drasi-host-sdk = { workspace = true }
drasi-reaction-http = { workspace = true }
bytes = "1"
tempfile = "3"

[lints]
workspace = true
