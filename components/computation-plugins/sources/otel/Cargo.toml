[package]
rust-version.workspace = true
name = "drasi-computation-source-otel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph OpenTelemetry (OTLP) source"
readme = "README.md"
keywords = ["drasi", "plugin", "opentelemetry", "otlp"]
categories = ["network-programming"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "0.2.0"
kind = "source-otel"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-network-common = { workspace = true, features = ["ingress", "grpc-listener"] }
drasi-computation-contracts = { workspace = true }
drasi-core-types = { workspace = true }
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
bytes = "1"
chrono = "0.4"
flate2 = "1"
ordered-float = "3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
tonic-prost = "0.14"

[dev-dependencies]
drasi-computation-plugin-sdk = { workspace = true, features = ["test-support"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[lints]
workspace = true
