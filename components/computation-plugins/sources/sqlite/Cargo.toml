[package]
rust-version.workspace = true
name = "drasi-computation-source-sqlite"
description = "Native SQLite source with an authenticated REST API, pause, managed updates and source-owned transaction replay"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "0.1.0"
kind = "source-sqlite"

[dependencies]
drasi-computation-contracts.workspace = true
drasi-computation-plugin-sdk.workspace = true
drasi-core-types.workspace = true
drasi-sqlite-common = { workspace = true, features = ["native-runtime", "rest"] }
drasi-computation-network-common = { workspace = true, features = ["listener"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
drasi-computation-plugin-sdk = { workspace = true, features = ["test-support"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
