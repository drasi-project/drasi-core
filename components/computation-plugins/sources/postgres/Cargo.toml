[package]
name = "drasi-computation-source-postgres"
description = "Native complete-transaction PostgreSQL replication source"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "source-postgres"

[dependencies]
drasi-computation-contracts.workspace = true
drasi-computation-plugin-sdk.workspace = true
drasi-core-types.workspace = true
drasi-postgres-common = { workspace = true, features = ["replication"] }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
bytes = "1"

[lints]
workspace = true
