[package]
rust-version.workspace = true
name = "drasi-computation-source-postgres"
description = "Native complete-transaction PostgreSQL replication source"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "0.1.0"
kind = "source-postgres"

[dependencies]
drasi-computation-contracts.workspace = true
drasi-computation-plugin-sdk.workspace = true
drasi-core-types.workspace = true
drasi-postgres-common = { workspace = true, features = ["replication"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }

# The live qualification suite (tests/native_transactions.rs) drives the
# plugin through drasi-lib graphs and the Host SDK. Dev-only edges are outside
# the native dependency boundary (ci/check_native_dependencies.py).
[dev-dependencies]
drasi-computation-bootstrap-postgres.workspace = true
drasi-computation-sink-storedproc-postgres.workspace = true
drasi-core.workspace = true
drasi-host-sdk.workspace = true
drasi-index-rocksdb = { workspace = true, features = ["computation"] }
drasi-lib.workspace = true
drasi-reaction-application.workspace = true
native-tls = "0.2"
rcgen = "0.13"
tempfile = "3"
testcontainers = "0.27"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

[lints]
workspace = true
