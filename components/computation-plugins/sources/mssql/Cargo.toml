[package]
name = "drasi-computation-source-mssql"
description = "Native SQL Server CDC source with per-consumer replay"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["native-tls"]
native-tls = ["drasi-mssql-common/native-tls"]
rustls = ["drasi-mssql-common/rustls"]
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "source-mssql"

[dependencies]
drasi-computation-contracts.workspace = true
drasi-computation-plugin-sdk.workspace = true
drasi-core-types.workspace = true
drasi-mssql-common = { workspace = true, features = ["native"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
chrono = "0.4"

[lints]
workspace = true
