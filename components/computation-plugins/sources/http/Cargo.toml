[package]
name = "drasi-computation-source-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph HTTP graph-change source"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "source-http"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-network-common = { workspace = true, features = ["http-source"] }
drasi-lib = { workspace = true }
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }

[lints]
workspace = true
