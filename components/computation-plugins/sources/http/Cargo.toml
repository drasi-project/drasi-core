[package]
name = "drasi-computation-source-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph HTTP graph-change source"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "source-http"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-network-common = { workspace = true, features = ["http-source"] }
drasi-computation-contracts = { workspace = true }
drasi-core-types = { workspace = true }
drasi-http-common = { workspace = true, features = ["webhook"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"

[lints]
workspace = true
