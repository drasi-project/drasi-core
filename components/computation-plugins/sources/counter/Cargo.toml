[package]
name = "drasi-computation-source-counter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph volatile counter source"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "source-counter"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-core-types = { workspace = true }
drasi-computation-contracts = { workspace = true }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[lints]
workspace = true
