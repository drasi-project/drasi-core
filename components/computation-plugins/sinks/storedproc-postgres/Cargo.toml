[package]
name = "drasi-computation-sink-storedproc-postgres"
description = "Native PostgreSQL stored-procedure delivery with transactional destination cursors"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "sink-storedproc-postgres"

[dependencies]
drasi-computation-contracts.workspace = true
drasi-computation-plugin-sdk.workspace = true
drasi-postgres-common = { workspace = true, features = ["storedproc"] }
drasi-reaction-common.workspace = true
anyhow = "1"
async-trait = "0.1"
log = "0.4"
native-tls = "0.2"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "macros", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[lints]
workspace = true
