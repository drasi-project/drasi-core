[package]
name = "drasi-computation-sink-sse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph browser SSE query-result sink"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "sink-sse"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-network-common = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-reaction-common = { workspace = true, features = ["sse"] }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.7"
chrono = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
