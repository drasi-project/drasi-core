[package]
rust-version.workspace = true
name = "drasi-computation-sink-sse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph browser SSE query-result sink"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "0.2.0"
kind = "sink-sse"

[dependencies]
drasi-computation-template-common = { workspace = true }
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-network-common = { workspace = true, features = ["listener"] }
drasi-computation-contracts = { workspace = true }
drasi-reaction-common = { workspace = true, features = ["sse"] }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.7"
chrono = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
drasi-computation-plugin-sdk = { workspace = true, features = ["test-support"] }
drasi-core-types = { workspace = true }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
