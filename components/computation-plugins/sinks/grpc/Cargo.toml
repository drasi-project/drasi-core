[package]
rust-version.workspace = true
name = "drasi-computation-sink-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph gRPC graph-change sink"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "5.0.0"
kind = "sink-grpc"

[dependencies]
drasi-computation-template-common = { workspace = true }
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-network-common = { workspace = true, features = ["grpc-sink"] }
drasi-grpc-common = { workspace = true, features = ["output"] }
drasi-computation-contracts = { workspace = true }
drasi-reaction-common = { workspace = true }
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots", "gzip"] }

[dev-dependencies]
drasi-computation-plugin-sdk = { workspace = true, features = ["test-support"] }
drasi-core-types = { workspace = true }
chrono = "0.4"
rcgen = "0.13"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
