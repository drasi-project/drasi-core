[package]
name = "drasi-computation-sink-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph gRPC query-output sink"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "1.0.0"
kind = "sink-grpc"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-network-common = { workspace = true, features = ["grpc-sink"] }
drasi-lib = { workspace = true }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tonic = "0.14"

[lints]
workspace = true
