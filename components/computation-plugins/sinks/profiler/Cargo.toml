[package]
rust-version.workspace = true
name = "drasi-computation-sink-profiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native ComputationGraph profiling sink"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "3.0.0"
kind = "sink-profiler"

[dependencies]
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-core-types = { workspace = true }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
