[package]
rust-version.workspace = true
name = "drasi-computation-sink-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inter-instance ComputationGraph bridge sink plugin"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[package.metadata.drasi-plugin]
abi-family = "computation"
abi-version = "0.2.0"
kind = "sink-bridge"

[dependencies]
drasi-computation-bridge-common = { workspace = true }
drasi-computation-contracts = { workspace = true }
drasi-computation-plugin-sdk = { workspace = true }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }

[lints]
workspace = true
