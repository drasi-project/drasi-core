[package]
name = "drasi-reaction-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared reaction configuration and rendering without a query runtime"
readme = "README.md"

[features]
default = []
sse = ["dep:anyhow", "dep:drasi-computation-contracts", "dep:handlebars", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = { version = "1", optional = true }
drasi-computation-contracts = { workspace = true, optional = true }
handlebars = { version = "5.1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
chrono = "0.4"
serde_json = "1"

[lints]
workspace = true
