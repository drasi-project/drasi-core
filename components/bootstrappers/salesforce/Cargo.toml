[package]
name = "drasi-bootstrap-salesforce"
version = "0.1.0"
edition = "2021"
authors = ["Drasi Project"]
description = "Bootstrap provider for durable Salesforce source snapshots"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "salesforce", "bootstrap"]
categories = ["network-programming"]

[lib]
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

[dependencies]
drasi-core.workspace = true
drasi-lib.workspace = true
drasi-plugin-sdk = { workspace = true }
drasi-salesforce-common = { workspace = true }
utoipa = { workspace = true }
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
sha2 = "0.10"
log = "0.4"
tokio = { version = "1.0", features = ["rt"] }

[features]
dynamic-plugin = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
