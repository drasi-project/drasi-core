[package]
name = "drasi-postgres-common"
version = "0.1.2"
edition = "2021"
authors = ["Drasi Project"]
description = "Shared PostgreSQL decoding, replication and parameterized delivery for Drasi plugins"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "postgres", "common"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
drasi-core-types.workspace = true
drasi-computation-contracts = { workspace = true, optional = true }
drasi-reaction-common = { workspace = true, optional = true }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
ordered-float = "3.0"
rust_decimal = "1.34"
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde"] }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
byteorder = { version = "1.5", optional = true }
handlebars = { version = "5.1", optional = true }
hmac = { version = "0.12", optional = true }
md5 = { version = "0.7", optional = true }
native-tls = { version = "0.2", optional = true }
pbkdf2 = { version = "0.12", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
postgres-types = { version = "0.2", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "1", optional = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"], optional = true }

[features]
default = []
replication = [
    "dep:drasi-computation-contracts", "dep:bytes", "dep:byteorder",
    "dep:hmac", "dep:md5", "dep:native-tls", "dep:pbkdf2",
    "dep:postgres-native-tls", "dep:postgres-types", "dep:rand",
    "dep:serde", "dep:sha2", "dep:tokio", "dep:tokio-postgres",
    "dep:openssl",
]
storedproc = [
    "dep:drasi-computation-contracts", "dep:drasi-reaction-common",
    "dep:async-trait", "dep:bytes", "dep:handlebars",
    "dep:postgres-types", "dep:thiserror", "dep:tokio-postgres",
    "rust_decimal/db-tokio-postgres",
]

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }
