[package]
name = "drasi-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDK for building Drasi plugins (sources, reactions, bootstrappers)"
readme = "README.md"

[dependencies]
drasi-ffi-primitives = { workspace = true }
drasi-lib = { workspace = true }
drasi-core = { workspace = true }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1"
thiserror = "2.0"
utoipa = { version = "4", features = ["chrono"] }
async-trait = "0.1"
anyhow = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
async-stream = "0.3"
log = "0.4"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tracing-log = "0.2"
jsonschema = { version = "0.18", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
drasi-source-mock = { path = "../sources/mock" }
drasi-reaction-log = { path = "../reactions/log" }
drasi-bootstrap-noop = { path = "../bootstrappers/noop" }
drasi-identity-test = { path = "../identity/test-fixture" }
drasi-secret-store-file = { path = "../secret_stores/file" }
drasi-index-rocksdb = { path = "../indexes/rocksdb", features = ["plugin-descriptor"] }
tempfile = "3.27.0"

[build-dependencies]
chrono = "0.4"

[lints]
workspace = true

[features]
computation = ["drasi-lib/computation", "drasi-core/computation", "dep:jsonschema"]
