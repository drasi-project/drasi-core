[package]
name = "drasi-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDK for building Drasi plugins (sources, reactions, bootstrappers)"
readme = "README.md"

[dependencies]
drasi-ffi-primitives = { workspace = true }
drasi-lib = { workspace = true }
drasi-core = { workspace = true }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1"
thiserror = "2.0"
utoipa = { version = "4", features = ["chrono"] }
async-trait = "0.1"
anyhow = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
async-stream = "0.3"
log = "0.4"
chrono = "0.4"
tracing = "0.1"
# Explicit rustls + ring so every cdylib that links the SDK has a CryptoProvider
# compiled in (linux-gnu zigbuild historically shipped rustls 0.23 with neither
# ring nor aws-lc-rs; see issue #781).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
tracing-log = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[build-dependencies]
chrono = "0.4"

[lints]
workspace = true
