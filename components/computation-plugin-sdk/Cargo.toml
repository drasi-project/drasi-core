[package]
name = "drasi-computation-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDK for native asynchronous ComputationGraph plugins"
readme = "README.md"

[dependencies]
drasi-computation-plugin-abi = { workspace = true }
drasi-lib = { workspace = true }
drasi-core = { workspace = true }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[lints]
workspace = true
