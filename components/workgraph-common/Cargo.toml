[package]
name = "drasi-workgraph-common"
version = "0.1.0"
edition = "2021"
authors = ["Drasi Project"]
description = "Shared WorkGraphEvent/v1 comment grammar, event envelope, and readable ID algorithms for Drasi WorkGraph components"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "workgraph", "common"]
categories = ["data-structures"]

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
utoipa = { workspace = true }
