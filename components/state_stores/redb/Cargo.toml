[package]
name = "drasi-state-store-redb"
version = "0.2.7"
edition = "2021"
license = "Apache-2.0"
description = "Redb-based state store provider for Drasi plugins"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "state-store", "redb", "embedded-database"]
categories = ["database"]

[lints]
workspace = true

[features]
configuration = ["dep:anyhow", "dep:chacha20poly1305", "dep:serde", "dep:serde_json", "dep:uuid"]

[dependencies]
drasi-lib.workspace = true

redb = "2.6.3"
async-trait = "0.1"
thiserror = "2.0"
log = "0.4"
tokio = { version = "1.0", features = ["sync", "rt"] }
anyhow = { version = "1", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["rt", "macros"] }
