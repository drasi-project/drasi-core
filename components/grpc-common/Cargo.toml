[package]
name = "drasi-grpc-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared source and reaction gRPC protocols and value conversion"
readme = "README.md"

[features]
default = []
output = [
    "reaction", "dep:drasi-computation-contracts", "dep:drasi-reaction-common",
    "dep:anyhow", "dep:chrono", "dep:handlebars", "dep:log", "dep:serde", "dep:utoipa",
    "dep:tokio", "dep:rand",
]
source = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]
reaction = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build"]

[dependencies]
drasi-computation-contracts = { workspace = true, optional = true }
drasi-reaction-common = { workspace = true, optional = true }
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
handlebars = { version = "5.1", optional = true }
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
utoipa = { workspace = true, optional = true }
tokio = { version = "1", features = ["time"], optional = true }
rand = { version = "0.8", optional = true }
prost = { version = "0.14", optional = true }
prost-types = "0.14"
serde_json = "1"
tonic = { version = "0.14.8", optional = true }
tonic-prost = { version = "0.14", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
drasi-core-types = { workspace = true }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }

[lints]
workspace = true
