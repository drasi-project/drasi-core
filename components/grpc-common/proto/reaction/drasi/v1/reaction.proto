syntax = "proto3";

// Wire contract for the Drasi gRPC reaction.
//
// Consumed by `drasi-reaction-grpc`. This file is intentionally narrow:
// it defines only what the reaction puts on the wire when forwarding
// continuous-query results to a downstream gRPC service. It carries no
// source-side, bootstrap, streaming, or subscription types — those are
// out of scope and live in their own components' protos when needed.
package drasi.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Service the gRPC reaction calls on its configured downstream
// endpoint. One unary `ProcessResults` RPC is sent per batch.
service ReactionService {
    rpc ProcessResults(ProcessResultsRequest) returns (ProcessResultsResponse);
}

// Producer-neutral graph changes from any source, transformer or query,
// delivered by the native gRPC sink. Unlike `ReactionService.ProcessResults`
// (the query reaction's row diffs), it carries no query identity or evaluator
// row signature: each change states its real operation, its canonical element
// identity and only the images the record actually holds.
service ChangeService {
    rpc ProcessChanges(ProcessChangesRequest) returns (ProcessResultsResponse);
}

// One ProcessResults call. Carries a single-query batch in `results`
// plus configured per-call request metadata in `metadata`.
//
// The reaction sends `metadata` entries both here as a body field and
// as actual gRPC request headers via `tonic::Request::metadata_mut()`,
// so receivers can read either. Entries with header names or values
// that are not valid HTTP/2 metadata are sent only in this body field.
message ProcessResultsRequest {
    QueryResult results = 1;
    map<string, string> metadata = 2;
}

message ProcessResultsResponse {
    // True only after all requested items have completed successfully.
    bool success = 1;
    string message = 2;
    string error = 3;
    // Must equal the request's item count when success is true. Zero/omitted,
    // partial or excessive counts do not acknowledge a nonempty batch.
    uint32 items_processed = 4;
}

// One coalesced batch of result-change items for a single continuous
// query. Multiple query ids or per-template metadata values in the same
// batching window arrive as separate `ProcessResultsRequest` RPCs —
// `query_id` is singular. `timestamp` is the latest event timestamp in
// `results`; the item-level timestamp is authoritative.
message QueryResult {
    string query_id = 1;
    repeated QueryResultItem results = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// Operation captured by a single QueryResultItem.
//
// Aggregations surface as UPDATE on the wire (consistent with the
// other Drasi reactions). Noop results are dropped at the runner
// before reaching the wire and have no enum value here.
enum QueryResultItemType {
    // Required by proto3 (every enum must have a zero-valued first
    // variant). Never emitted by the reaction; receiving this value
    // indicates a contract violation.
    QUERY_RESULT_ITEM_TYPE_UNSPECIFIED = 0;
    QUERY_RESULT_ITEM_TYPE_ADD         = 1;
    QUERY_RESULT_ITEM_TYPE_UPDATE      = 2;
    QUERY_RESULT_ITEM_TYPE_DELETE      = 3;
}

// One result-change item.
//
// `before` and `after` carry the row state on either side of the
// change. Per op:
//   ADD     — only `after` set (the row did not exist before).
//   DELETE  — only `before` set (the row no longer exists).
//   UPDATE  — both set (row content changed).
//
// `before` and `after` always carry the unmodified raw row state for
// the change regardless of templating, so receivers can always recover
// the change. Output templates do not rewrite `before` / `after`; when
// a body template matches the item's `(query_id, op)` it is rendered
// once into `payload` (see below). Events are never dropped because of
// a render failure.
//
// `timestamp` is the original event timestamp from the `QueryResult`
// this item originated from. `metadata` is the query-result metadata
// supplied by Drasi for that emission. `payload` carries the canonical
// guide-aligned JSON payload, or — when a body template matches the
// item — the rendered template output, as a protobuf Struct. On render
// failure `payload` falls back to the canonical item. In `proto`
// output mode `payload` is omitted unless a body template applies.
//
// `sequence` is the monotonic per-query emission number of the
// `QueryResult` this item originated from. Because one
// `ProcessResultsRequest` may coalesce items from several emissions of
// the same query, the sequence is carried per item rather than on the
// envelope. Receivers can use sequence + timestamp to order or
// de-duplicate emissions.
message QueryResultItem {
    QueryResultItemType item_type = 1;
    uint64 row_signature = 2;
    google.protobuf.Struct before = 3;
    google.protobuf.Struct after  = 4;
    uint64 sequence = 5;
    google.protobuf.Timestamp timestamp = 6;
    google.protobuf.Struct metadata = 7;
    google.protobuf.Struct payload = 8;
}

// One ProcessChanges call: a single-output batch of ordered graph changes plus
// the configured per-call request metadata (also sent as gRPC headers).
message ProcessChangesRequest {
    ChangeBatch changes = 1;
    map<string, string> metadata = 2;
}

// The configured output that produced a batch: a real component output port,
// which may belong to a source, transformer or query. `alias` is only the
// sink's route/display name for the output; it is not an identity.
message OutputIdentity {
    string alias     = 1;
    string component = 2;
    string port      = 3;
}

// Changes from one configured output. It is not a query identity. `timestamp`
// is the latest item time.
message ChangeBatch {
    OutputIdentity output = 1;
    repeated Change changes = 2;
    google.protobuf.Timestamp timestamp = 3;
}

enum ChangeOperation {
    CHANGE_OPERATION_UNSPECIFIED = 0;
    // The element joins the dataset; `after` is its complete image.
    CHANGE_OPERATION_ADD         = 1;
    // `after` is the complete element and replaces the previous one, so absent
    // properties are removed.
    CHANGE_OPERATION_REPLACE     = 2;
    // `after` holds only the properties that are set (a null stays null);
    // `removed_properties` names the properties that are removed; everything
    // else is unchanged.
    CHANGE_OPERATION_PATCH       = 3;
    // The element leaves the dataset.
    CHANGE_OPERATION_DELETE      = 4;
}

// Canonical element identity: the producing output's namespace and an opaque,
// output-scoped key. For a query result row this is the evaluator's row
// identity, hex encoded.
message ElementIdentity {
    string namespace = 1;
    string id = 2;
}

// Node or relation shape. Absent when a deletion carries only its identity.
message ElementShape {
    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_NODE        = 1;
        KIND_RELATION    = 2;
    }
    Kind kind = 1;
    repeated string labels = 2;
    // Relation endpoints: (in_node)-[relation]->(out_node).
    ElementIdentity in_node = 3;
    ElementIdentity out_node = 4;
}

// One element change. `before`, `after` and `element` are present only when the
// record carries them: an unknown before-image is absent, not an empty object.
message Change {
    ChangeOperation operation = 1;
    ElementIdentity identity = 2;
    ElementShape element = 3;
    google.protobuf.Struct before = 4;
    google.protobuf.Struct after = 5;
    repeated string removed_properties = 6;
    // The producing stream's sequence for the envelope carrying this change.
    uint64 sequence = 7;
    // The envelope's event time, only when it carries one. Never derived from
    // the element's business time or the sequence.
    google.protobuf.Timestamp timestamp = 8;
    // Canonical JSON change (or a rendered body template), as a Struct.
    google.protobuf.Struct payload = 9;
}
