[package]
name = "drasi-host-sdk"
version.workspace = true
edition = "2021"
description = "Host-side SDK for loading and interacting with Drasi cdylib plugins"
license = "Apache-2.0"

[features]
default = []
registry = ["oci-client", "tokio/fs", "x509-parser", "p256", "p384", "pem", "base64"]
fetcher = ["reqwest", "url", "tokio/fs"]
watcher = ["notify", "notify-debouncer-mini"]

[dependencies]
drasi-ffi-primitives = { workspace = true }
drasi-lib = { workspace = true }
drasi-core = { workspace = true }
drasi-plugin-sdk = { workspace = true, features = ["computation"] }
drasi-computation-plugin-abi = { workspace = true }
drasi-computation-plugin-sdk = { workspace = true }
drasi-computation-contracts = { workspace = true }
libloading = "0.8"
async-trait = "0.1"
anyhow = "1.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tracing = "0.1"
tokio-stream = "0.1"
futures-util = "0.3"
indexmap = "2"
chrono = "0.4"
sha2 = "0.10"
toml = "0.8"
semver = "1.0"

# Optional: OCI registry support
oci-client = { version = "0.16", optional = true }
x509-parser = { version = "0.16", optional = true }
p256 = { version = "0.14", features = ["ecdsa"], optional = true }
p384 = { version = "0.14", features = ["ecdsa"], optional = true }
pem = { version = "3", optional = true }
base64 = { version = "0.22", optional = true }

# Optional: HTTP fetching support
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }
url = { version = "2", optional = true }

# Optional: filesystem watcher support
notify = { version = "6", optional = true }
notify-debouncer-mini = { version = "0.4", optional = true }

[lints]
workspace = true

[dev-dependencies]
drasi-computation-bootstrap-mssql = { workspace = true }
drasi-computation-source-mssql = { workspace = true }
drasi-computation-sink-storedproc-mssql = { workspace = true }
drasi-computation-bootstrap-http = { workspace = true }
drasi-computation-bootstrap-mysql = { workspace = true }
drasi-computation-bootstrap-postgres = { workspace = true }
drasi-computation-bootstrap-sqlite = { workspace = true }
drasi-computation-network-common = { workspace = true, features = ["http-source", "grpc-source", "http-sink", "grpc-sink"] }
drasi-computation-source-grpc = { workspace = true }
drasi-computation-source-http = { workspace = true }
drasi-computation-source-mysql = { workspace = true }
drasi-computation-source-postgres = { workspace = true }
drasi-computation-source-sqlite = { workspace = true }
drasi-computation-sink-http = { workspace = true }
drasi-computation-sink-grpc = { workspace = true }
drasi-computation-sink-sse = { workspace = true }
drasi-computation-sink-storedproc-mysql = { workspace = true }
drasi-source-http = { path = "../sources/http" }
drasi-source-grpc = { path = "../sources/grpc" }
drasi-reaction-http = { workspace = true }
drasi-reaction-grpc = { workspace = true }
drasi-source-sqlite = { path = "../sources/sqlite" }
drasi-index-rocksdb = { workspace = true, features = ["computation"] }
drasi-state-store-redb = { workspace = true, features = ["configuration"] }
tempfile = "3"
libloading = "0.8"
rmp-serde = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
serial_test = "3"
im = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
async-stream = "0.3"
axum = "0.7"
prost-types = "0.14"
tonic = "0.14"

[[example]]
name = "native_activation_credentials"
path = "tests/fixtures/native_activation_credentials.rs"
crate-type = ["cdylib"]
test = false

[[example]]
name = "native_recovery"
path = "tests/fixtures/native_recovery.rs"
crate-type = ["cdylib"]
test = false

[[example]]
name = "native_consumer_progress_metadata"
path = "tests/fixtures/native_consumer_progress_metadata.rs"
crate-type = ["cdylib"]
test = false

[[example]]
name = "native_bootstrap_coordination_metadata"
path = "tests/fixtures/native_bootstrap_coordination_metadata.rs"
crate-type = ["cdylib"]
test = false

[[example]]
name = "native_bootstrap_coordination_partial"
path = "tests/fixtures/native_bootstrap_coordination_partial.rs"
crate-type = ["cdylib"]
test = false
