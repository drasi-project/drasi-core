# Seed configuration for a DrasiLib instance: a simple Source -> Query -> Reaction.
#
# This is a DesiredInstance, DrasiLib's complete stored definition of an
# instance. DrasiLib generated it (desired_configuration). A host commits it to
# an empty configuration store with RedbConfigurationStore::initialize_if_absent,
# and the builder constructs the graph from the store. Run it with yaml_pipeline.rs.
#
#   numbers  (native volatile counter source) emits Counter nodes 1..10
#   evens    (DrasiLib continuous query)      keeps the even values
#   printer  (native log sink)                prints each change to stdout
#
# topology.components:             the native components, each with its plugin's
#                                  full descriptor (ports and schemas; schema text
#                                  is stored as a list of bytes) and factory recipe
# topology.boundary_relationships: the evens -> printer connection
# ordinary:                        the query; its input is the counter's ID
