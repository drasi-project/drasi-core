[package]
name = "drasi-identity-aws"
version = "0.2.6"
edition = "2021"
authors = ["Drasi Project"]
description = "AWS identity provider plugin for Drasi"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "plugin", "identity", "aws"]
categories = ["authentication"]

[lib]
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

[dependencies]
drasi-lib.workspace = true
drasi-plugin-sdk = { workspace = true }
utoipa = { workspace = true }
anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Stay on the smithy-json 0.63 / smithy-types 1.6 line used by aws-config 1.12.
# Newer aws-sdk-* crates require smithy-types 1.7, which does not compile with
# smithy-json 0.63.
aws-config = "~1.12"
aws-sdk-rds = { version = "~1.148", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sts = { version = "~1.114", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sigv4a",
] }
aws-smithy-types = ">=1.6.3, <1.7"

[features]
dynamic-plugin = []
