[package]
name = "drasi-identity-aws"
version = "0.2.8"
edition = "2021"
authors = ["Drasi Project"]
description = "AWS identity provider plugin for Drasi"
license = "Apache-2.0"
repository = "https://github.com/drasi-project/drasi-core"
keywords = ["drasi", "plugin", "identity", "aws"]
categories = ["authentication"]

[lib]
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

[dependencies]
drasi-lib.workspace = true
drasi-plugin-sdk = { workspace = true }
utoipa = { workspace = true }
anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Keep the SDK and Smithy release families aligned; SigV4a requires the
# constant-time crypto-bigint fixes in aws-sigv4 1.6.4.
aws-config = "=1.13.0"
aws-sdk-rds = { version = "=1.158.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sts = { version = "=1.123.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sigv4a",
] }
aws-runtime = "=1.10.2"
aws-sigv4 = "1.6.4"
aws-smithy-runtime = "=1.16.2"
aws-smithy-types = "=1.9.1"

[features]
dynamic-plugin = []
