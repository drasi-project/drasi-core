[package]
name = "drasi-computation-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared native component messages, schemas and interfaces without the graph runtime"
readme = "README.md"

[features]
default = []
test-support = []

[dependencies]
drasi-core-types = { workspace = true }
drasi-query-ast = { workspace = true }
anyhow = "1"
async-trait = "0.1"
bincode = "1.3"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
im = { workspace = true }
futures-core = "0.3"
log = "0.4"
rmp-serde = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
futures = "0.3"
ordered-float = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
