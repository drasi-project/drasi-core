[package]
name = "drasi-computation-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared native component messages, schemas and interfaces without the graph runtime"
readme = "README.md"

[features]
default = []
test-support = []
metrics-facade = ["dep:metrics"]
tracing-context = ["dep:tracing", "dep:pin-project-lite"]
otel-context = ["tracing-context", "dep:opentelemetry", "dep:tracing-opentelemetry", "dep:opentelemetry_sdk"]

[dependencies]
drasi-core-types = { workspace = true }
drasi-query-ast = { workspace = true }
anyhow = "1"
async-trait = "0.1"
bincode = "1.3"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
im = { workspace = true }
futures-core = "0.3"
log = "0.4"
rmp-serde = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
metrics = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
pin-project-lite = { version = "0.2", optional = true }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"], optional = true }
tracing-opentelemetry = { version = "0.32", default-features = false, optional = true }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"], optional = true }

[lints]
workspace = true

[dev-dependencies]
futures = "0.3"
ordered-float = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "testing"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
